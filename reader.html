<!DOCTYPE html>
<html>
<head>
    <title>Image Pixel Reader to SVG Script</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        textarea { width: 100%; height: 300px; margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
    </style>
</head>
<body>

    <div class="drop-box" id="drop">Click or Drop Image Here to Extract Pixels</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <textarea id="output" readonly placeholder="Raw SVG vector element script will print here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        drop.ondrop = (e) => { e.preventDefault(); process(e.dataTransfer.files[0]); };
        file.onchange = (e) => process(e.target.files[0]);

        function process(item) {
            if (!item) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Create a virtual canvas background pipeline to read individual bytes
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Grab the raw underlying RGBA flat pixel sequence array
                    const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                    
                    let svg = `<svg xmlns="http://w3.org" viewBox="0 0 ${img.width} ${img.height}" shape-rendering="crispEdges">\n`;

                    // Read through the linear array coordinates map
                    for (let y = 0; y < img.height; y++) {
                        for (let x = 0; x < img.width; x++) {
                            const index = (y * img.width + x) * 4;
                            const r = imgData[index];
                            const g = imgData[index + 1];
                            const b = imgData[index + 2];
                            const a = imgData[index + 3];

                            if (a === 0) continue; // Skip transparency

                            // Convert current read pointer to Hex values
                            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                            
                            if (a < 255) {
                                const alpha = (a / 255).toFixed(2);
                                svg += `  <rect x="${x}" y="${y}" width="1" height="1" fill="${hex}" fill-opacity="${alpha}" />\n`;
                            } else {
                                svg += `  <rect x="${x}" y="${y}" width="1" height="1" fill="${hex}" />\n`;
                            }
                        }
                    }
                    svg += `</svg>`;
                    output.value = svg;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(item);
        }
    </script>

</body>
</html>
