
<!DOCTYPE html>
<html>
<head>
    <title>Optimized Pixel Reader to SVG Script</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        textarea { width: 100%; height: 300px; margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
    </style>
</head>
<body>

    <div class="drop-box" id="drop">Click or Drop Image Here to Extract Pixels (Optimized Rows)</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <textarea id="output" readonly placeholder="Optimized SVG vector element script will print here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        drop.ondrop = (e) => { e.preventDefault(); process(e.dataTransfer.files[0]); };
        file.onchange = (e) => process(e.target.files[0]);

        function process(selectedFile) {
            if (!selectedFile) return;
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                try {
                    const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                    let svg = `<svg xmlns="http://w3.org" viewBox="0 0 ${img.width} ${img.height}" shape-rendering="crispEdges">\n`;

                    // Loop through each horizontal row
                    for (let y = 0; y < img.height; y++) {
                        let runStart = 0;
                        let runColor = "";
                        let runAlpha = 0;
                        let inRun = false;

                        for (let x = 0; x < img.width; x++) {
                            const index = (y * img.width + x) * 4;
                            const r = imgData[index];
                            const g = imgData[index + 1];
                            const b = imgData[index + 2];
                            const a = imgData[index + 3];

                            // Generate Hex and Alpha
                            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                            const alpha = a / 255;

                            // If we are currently tracking a pixel run
                            if (inRun) {
                                // Check if current pixel matches the running target properties
                                if (a === imgData[(y * img.width + runStart) * 4 + 3] && hex === runColor) {
                                    continue; // Pixel matches, extend the width sequence
                                } else {
                                    // Pixel changed, close and write the previous sequence block
                                    svg += writeRect(runStart, y, x - runStart, runColor, runAlpha);
                                    inRun = false;
                                }
                            }

                            // Start a brand new horizontal element run if not fully transparent
                            if (a > 0) {
                                runStart = x;
                                runColor = hex;
                                runAlpha = alpha;
                                inRun = true;
                            }
                        }

                        // Catch lingering pixel patterns at the absolute right boundary edge of the row matrix
                        if (inRun) {
                            svg += writeRect(runStart, y, img.width - runStart, runColor, runAlpha);
                        }
                    }

                    svg += `</svg>`;
                    output.value = svg;
                    drop.innerText = "Success! Optimized Code Generated Below.";
                } catch (err) {
                    output.value = "Error reading pixels: " + err.message;
                }
            };

            img.src = URL.createObjectURL(selectedFile);
        }

        // Helper function to build custom dimension nodes dynamically
        function writeRect(x, y, width, hex, alpha) {
            if (alpha < 1) {
                return `  <rect x="${x}" y="${y}" width="${width}" height="1" fill="${hex}" fill-opacity="${alpha}.toFixed(2)" />\n`;
            } else {
                return `  <rect x="${x}" y="${y}" width="${width}" height="1" fill="${hex}" />\n`;
            }
        }
    </script>

</body>
</html>
