<!DOCTYPE html>
<html>
<head>
    <title>Simple Line SVG Board</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 10px; gap: 10px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        #canvasFrame { flex: 1; border: 2px solid black; position: relative; background: #fff; cursor: crosshair; }
        svg { width: 100%; height: 100%; position: absolute; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="loader" accept=".svg,.jpg,.jpeg,.png">
        <label><input type="checkbox" id="snap"> Snap Straight (0°/90°)</label>
        <button id="saveBtn" style="margin-left:auto; background: green; color: white;">💾 Save SVG</button>
    </div>

    <div id="canvasFrame">
        <svg id="box">
            <!-- Layers for background assets and live user artwork -->
            <g id="bg"></g>
            <g id="art"></g>
            <line id="preview" stroke="red" stroke-width="2" stroke-dasharray="4" style="display:none"></line>
        </svg>
    </div>

    <script>
        const box = document.getElementById('box');
        const art = document.getElementById('art');
        const bg = document.getElementById('bg');
        const preview = document.getElementById('preview');
        const frame = document.getElementById('canvasFrame');
        const snap = document.getElementById('snap');

        let drawing = false, startX = 0, startY = 0;

        // Get coordinates relative to the canvas boundary box
        const getXY = (e) => {
            const r = box.getBoundingClientRect();
            return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
        };

        // Pointer Controls (Handles Touch, Mouse, and Stylus automatically)
        frame.onpointerdown = (e) => {
            if (e.target.closest('.controls')) return;
            drawing = true;
            const p = getXY(e);
            startX = p.x; startY = p.y;
            preview.setAttribute('x1', startX); preview.setAttribute('y1', startY);
            preview.style.display = 'block';
        };

        window.onpointermove = (e) => {
            if (!drawing) return;
            const p = getXY(e);
            let endX = p.x, endY = p.y;

            // Straight Line Logic: Force the line to lock horizontally or vertically
            if (snap.checked) {
                if (Math.abs(endX - startX) > Math.abs(endY - startY)) endY = startY;
                else endX = startX;
            }

            preview.setAttribute('x2', endX); preview.setAttribute('y2', endY);
        };

        window.onpointerup = (e) => {
            if (!drawing) return;
            drawing = false;
            preview.style.display = 'none';

            const x2 = preview.getAttribute('x2'), y2 = preview.getAttribute('y2');
            if (startX != x2 || startY != y2) {
                const n = document.createElementNS("http://w3.org", "line");
                n.setAttribute('x1', startX); n.setAttribute('y1', startY);
                n.setAttribute('x2', x2);     n.setAttribute('y2', y2);
                n.setAttribute('stroke', 'black'); n.setAttribute('stroke-width', '3');
                art.appendChild(n);
            }
        };

        // File Importer (Handles raw code parsing or trace-overlay generation)
        document.getElementById('loader').onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();

            if (f.type.includes('svg')) {
                r.onload = (ev) => {
                    const parsed = new DOMParser().parseFromString(ev.target.result, "image/svg+xml");
                    Array.from(parsed.documentElement.children).forEach(n => bg.appendChild(document.importNode(n, true)));
                };
                r.readAsText(f);
            } else {
                r.onload = (ev) => {
                    const img = document.createElementNS("http://w3.org", "image");
                    img.setAttributeNS('http://w3.org', 'href', ev.target.result);
                    img.setAttribute('width', '100%'); img.setAttribute('height', '100%');
                    bg.innerHTML = ''; bg.appendChild(img);
                };
                r.readAsDataURL(f);
            }
        };

        // Save File Export Pipeline
        document.getElementById('saveBtn').onclick = () => {
            const blob = new Blob([new XMLSerializer().serializeToString(box)], {type: "image/svg+xml"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "drawing.svg";
            a.click();
        };
    </script>
</body>
</html>
