<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image to HTML Canvas Script Generator</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 20px; color: #222; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        .drop-box.dragging { background: #e8f2ff; border-color: #1769aa; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; align-items: center; }
        button { padding: 9px 14px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        textarea { box-sizing: border-box; width: 100%; height: 300px; margin-top: 12px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
        #status { min-height: 1.4em; }
    </style>
</head>
<body>
    <div class="drop-box" id="drop">Click or drop an image here to generate a standalone canvas page</div>
    <input type="file" id="file" accept="image/*" hidden>
    <p id="status" role="status" aria-live="polite">Choose an image to begin.</p>

    <div class="controls">
        <button id="download" type="button" disabled>Download HTML</button>
    </div>

    <label for="output"><strong>Generated HTML</strong></label>
    <textarea id="output" readonly placeholder="Generated HTML will appear here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('file');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const downloadButton = document.getElementById('download');
        const MAX_INLINE_HTML_BYTES = 2 * 1024 * 1024;
        // Bound canvas memory for huge inputs while retaining the complete original image in the HTML.
        const MAX_CANVAS_PIXELS = 25_000_000;
        let currentHtmlBlob = null;
        let runId = 0;

        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', (event) => {
            event.preventDefault();
            drop.classList.add('dragging');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
        drop.addEventListener('drop', (event) => {
            event.preventDefault();
            drop.classList.remove('dragging');
            process(event.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (event) => {
            process(event.target.files[0]);
            fileInput.value = '';
        });
        downloadButton.addEventListener('click', downloadHtml);

        async function process(selectedFile) {
            if (!selectedFile) return;
            if (!selectedFile.type.startsWith('image/')) {
                status.textContent = 'Please choose a valid image file.';
                return;
            }

            const thisRun = ++runId;
            currentHtmlBlob = null;
            output.value = '';
            downloadButton.disabled = true;
            status.textContent = 'Loading image…';
            const objectUrl = URL.createObjectURL(selectedFile);

            try {
                const dimensions = await readImageDimensions(objectUrl);
                if (thisRun !== runId) return;
                const { width, height } = dimensions;
                if (!width || !height || !Number.isSafeInteger(width * height)) {
                    throw new Error('The image dimensions are invalid or too large to process.');
                }

                status.textContent = 'Embedding the original image for the standalone canvas page…';
                const dataUrl = await readFileAsDataUrl(selectedFile);
                if (thisRun !== runId) return;

                const html = makeCanvasHtml(width, height, dataUrl);
                currentHtmlBlob = new Blob([html], { type: 'text/html;charset=utf-8' });
                if (currentHtmlBlob.size <= MAX_INLINE_HTML_BYTES) {
                    output.value = html;
                } else {
                    output.value = `HTML generated (${formatBytes(currentHtmlBlob.size)}). It is too large to display safely in this text area; use “Download HTML” to save the complete file.`;
                }
                downloadButton.disabled = false;
                drop.textContent = 'Success! Drop another image or click to choose one.';
                const scaleNote = width * height > MAX_CANVAS_PIXELS
                    ? `; canvas preview scaled to fit the ${MAX_CANVAS_PIXELS.toLocaleString()}-pixel memory limit`
                    : '';
                status.textContent = `Standalone canvas HTML generated (${width.toLocaleString()} × ${height.toLocaleString()}; ${formatBytes(currentHtmlBlob.size)}${scaleNote}).`;
            } catch (error) {
                if (thisRun === runId) {
                    currentHtmlBlob = null;
                    output.value = '';
                    downloadButton.disabled = true;
                    status.textContent = 'Could not process image: ' + error.message;
                }
            } finally {
                URL.revokeObjectURL(objectUrl);
            }
        }

        function readImageDimensions(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
                image.onerror = () => reject(new Error('The selected file could not be loaded as an image.'));
                image.src = url;
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('The original image could not be embedded in the HTML.'));
                reader.onabort = () => reject(new Error('Reading the image was cancelled.'));
                reader.readAsDataURL(file);
            });
        }

        function makeCanvasHtml(width, height, dataUrl) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvas Image</title>
    <style>
        body { margin: 0; }
        canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
</head>
<body>
    <canvas id="stage" width="${width}" height="${height}"></canvas>
    <script>
        // Keep the full source image embedded, but cap the canvas backing store to
        // avoid allocating an enormous pixel buffer for very large images.
        const MAX_CANVAS_PIXELS = ${MAX_CANVAS_PIXELS};
        const sourceWidth = ${width};
        const sourceHeight = ${height};
        const scale = Math.min(1, Math.sqrt(MAX_CANVAS_PIXELS / (sourceWidth * sourceHeight)));
        const canvas = document.getElementById('stage');
        canvas.width = Math.max(1, Math.floor(sourceWidth * scale));
        canvas.height = Math.max(1, Math.floor(sourceHeight * scale));
        const context = canvas.getContext('2d');
        if (!context) throw new Error('This browser could not create a canvas context.');
        context.imageSmoothingEnabled = false;

        const image = new Image();
        image.onload = () => context.drawImage(image, 0, 0, canvas.width, canvas.height);
        image.onerror = () => { document.body.textContent = 'The embedded image could not be loaded.'; };
        image.src = ${JSON.stringify(dataUrl)};
    <\\/script>
</body>
</html>`;
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        function downloadHtml() {
            if (!currentHtmlBlob) return;
            const url = URL.createObjectURL(currentHtmlBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'canvas-image.html';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
