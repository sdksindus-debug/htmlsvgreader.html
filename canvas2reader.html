<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to HTML Canvas Script Generator</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        textarea { width: 100%; height: 450px; background: #1e1e1e; color: #4af626; padding: 15px; box-sizing: border-box; font-family: monospace; font-size: 11px; border-radius: 4px; border: 1px solid #000; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Image to Canvas Element Script Generator</h2>
    <div class="drop-box" id="drop">Click or Drop Image Here to Generate HTML Canvas Code</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <textarea id="output" readonly placeholder="The fully formed HTML canvas engine markup code will print here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        
        drop.ondrop = (e) => { e.preventDefault(); if(e.dataTransfer.files.length) process(e.dataTransfer.files[0]); };
        file.onchange = (e) => { if(e.target.files.length) process(e.target.files[0]); };

        function process(targetFile) {
            if (!targetFile) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const base64Data = event.target.result;
                    const w = img.width;
                    const h = img.height;

                    // Compile the absolute independent HTML document string containing canvas scripting
                    const generatedCanvasCode = `<!DOCTYPE html>
<html>
<head>
    <style>
        /* Locks rendering pipelines to match raw hardware coordinates */
        canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: auto; }
    </style>
</head>
<body>
    <canvas id="stage" width="${w}" height="${h}"></canvas>
    <script>
        const c = document.getElementById('stage');
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = "${base64Data}";
    <\/script>
</body>
</html>`;

                    output.value = generatedCanvasCode;
                    drop.innerText = `Successfully Generated HTML Canvas Script (${w}x${h}px)`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(targetFile);
        }
    </script>

</body>
</html>
