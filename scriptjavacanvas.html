<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to Canvas Script Generator</title>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 20px; }
    .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
    .drop-box.dragging { background: #e8f2ff; border-color: #1769aa; }
    button { padding: 9px 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <h2>Image to Canvas Script Generator</h2>
  <div id="drop" class="drop-box" tabindex="0" role="button">Click or Drop an Image</div>
  <input id="file" type="file" accept="image/*" hidden>
  <p id="status" role="status" aria-live="polite">Choose an image to begin.</p>
  <button id="download" type="button" disabled>Download Script</button>

<script>
(() => {
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const status = document.getElementById('status');
  const downloadButton = document.getElementById('download');
  const TILE_SIZE = 256;
  let currentBlob = null;
  let runId = 0;

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      fileInput.click();
    }
  });
  drop.addEventListener('dragover', event => {
    event.preventDefault();
    drop.classList.add('dragging');
  });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
  drop.addEventListener('drop', event => {
    event.preventDefault();
    drop.classList.remove('dragging');
    processFile(event.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', event => {
    processFile(event.target.files[0]);
    fileInput.value = '';
  });
  downloadButton.addEventListener('click', () => {
    if (!currentBlob) return;
    const url = URL.createObjectURL(currentBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'canvas-lines-compact.js';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  async function processFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      status.textContent = 'Please choose a valid image file.';
      return;
    }

    const thisRun = ++runId;
    currentBlob = null;
    downloadButton.disabled = true;
    status.textContent = 'Loading image…';

    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.decoding = 'async';

    try {
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('The selected file could not be loaded as an image.'));
        image.src = objectUrl;
      });

      if (thisRun !== runId) return;

      const width = image.naturalWidth;
      const height = image.naturalHeight;
      if (!width || !height || !Number.isSafeInteger(width * height)) {
        throw new Error('The image dimensions are invalid or too large to process.');
      }

      const tileCanvas = document.createElement('canvas');
      const tileContext = tileCanvas.getContext('2d', { willReadFrequently: true });
      if (!tileContext) throw new Error('This browser could not create a canvas context.');

      const palette = [];
      const paletteMap = new Map();
      const runs = [];
      const totalTiles = Math.ceil(width / TILE_SIZE) * Math.ceil(height / TILE_SIZE);
      let completedTiles = 0;

      // Process each tile-row as a group. Buffering that tile-row's runs by source
      // row lets us emit globally sorted [y, xStart, xEnd, paletteIndex] tuples,
      // even when an image spans multiple horizontal tiles.
      for (let tileY = 0; tileY < height; tileY += TILE_SIZE) {
        const tileHeight = Math.min(TILE_SIZE, height - tileY);
        const rowRuns = Array.from({ length: tileHeight }, () => []);

        for (let tileX = 0; tileX < width; tileX += TILE_SIZE) {
          if (thisRun !== runId) return;

          const tileWidth = Math.min(TILE_SIZE, width - tileX);
          tileCanvas.width = tileWidth;
          tileCanvas.height = tileHeight;
          tileContext.drawImage(image, tileX, tileY, tileWidth, tileHeight, 0, 0, tileWidth, tileHeight);
          const pixels = tileContext.getImageData(0, 0, tileWidth, tileHeight).data;

          for (let y = 0; y < tileHeight; y++) {
            let runStart = -1;
            let runColor = null;

            for (let x = 0; x <= tileWidth; x++) {
              const index = x < tileWidth ? (y * tileWidth + x) * 4 : -1;
              const alpha = x < tileWidth ? pixels[index + 3] : 0;
              let color = null;

              if (x < tileWidth && alpha > 0) {
                const r = pixels[index];
                const g = pixels[index + 1];
                const b = pixels[index + 2];
                color = `rgba(${r},${g},${b},${(alpha / 255).toFixed(3)})`;
              }

              if (runStart >= 0 && color !== runColor) {
                let paletteIndex = paletteMap.get(runColor);
                if (paletteIndex === undefined) {
                  paletteIndex = palette.length;
                  palette.push(runColor);
                  paletteMap.set(runColor, paletteIndex);
                }
                rowRuns[y].push([tileY + y, runStart + tileX, x - 1 + tileX, paletteIndex]);
                runStart = -1;
                runColor = null;
              }

              if (color !== null && runStart < 0) {
                runStart = x;
                runColor = color;
              }
            }
          }

          completedTiles++;
          status.textContent = `Converting image… ${Math.floor(completedTiles / totalTiles * 100)}%`;
        }

        for (const row of rowRuns) runs.push(...row);
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      if (thisRun !== runId) return;

      const scriptParts = [
        '// Compact Canvas Line Script\n',
        '// Usage: const c = document.getElementById("myCanvas"); const ctx = c.getContext("2d");\n',
        `// Source dimensions: ${width} x ${height}\n`,
        'ctx.lineWidth = 1;\n',
        'const PALETTE = ['
      ];

      for (let i = 0; i < palette.length; i++) {
        if (i) scriptParts.push(',');
        scriptParts.push(JSON.stringify(palette[i]));
      }

      scriptParts.push('];\nconst RUNS = [');
      for (let i = 0; i < runs.length; i++) {
        if (i) scriptParts.push(',');
        scriptParts.push(JSON.stringify(runs[i]));
      }

      scriptParts.push(
        '];\n',
        '// Replay compressed runs (fast, compact)\n',
        'for (let i = 0, L = RUNS.length; i < L; i++) {\n',
        '  const r = RUNS[i];\n',
        '  const y = r[0] + 0.5;\n',
        '  const x0 = r[1] + 0.5;\n',
        '  const x1 = r[2] + 0.5;\n',
        '  ctx.strokeStyle = PALETTE[r[3]];\n',
        '  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();\n',
        '}\n'
      );

      currentBlob = new Blob(scriptParts, { type: 'text/javascript;charset=utf-8' });
      downloadButton.disabled = false;
      drop.textContent = 'Success! Drop another image or click to choose one.';
      status.textContent = `Script ready (${width} × ${height}; ${palette.length.toLocaleString()} colors; ${runs.length.toLocaleString()} runs, sorted by row and x).`;
    } catch (error) {
      if (thisRun === runId) {
        currentBlob = null;
        downloadButton.disabled = true;
        status.textContent = 'Could not process image: ' + error.message;
      }
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  }
})();
</script>
</body>
</html>
