<!DOCTYPE html>
<html>
<head>
    <title>Image Pixel Reader to SVG Script</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        textarea { width: 100%; height: 300px; margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
    </style>
</head>
<body>

    <div class="drop-box" id="drop">Click or Drop Image Here to Extract Pixels</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <textarea id="output" readonly placeholder="Raw SVG vector element script will print here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        drop.ondrop = (e) => {
            e.preventDefault();
            const fileItem = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
            process(fileItem);
        };
        file.onchange = (e) => process(e.target.files && e.target.files[0]);

        function process(selectedFile) {
            if (!selectedFile) return;
            if (!selectedFile.type.startsWith('image/')) {
                output.value = 'Please select a valid image file.';
                return;
            }

            const objectUrl = URL.createObjectURL(selectedFile);
            const img = new Image();

            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    if (!ctx) {
                        throw new Error('Canvas is not supported in this browser.');
                    }

                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                    const svgNS = 'http://www.w3.org/2000/svg';
                    let svg = `<svg xmlns="${svgNS}" viewBox="0 0 ${img.width} ${img.height}" shape-rendering="crispEdges">\n`;

                    for (let y = 0; y < img.height; y++) {
                        for (let x = 0; x < img.width; x++) {
                            const index = (y * img.width + x) * 4;
                            const r = imgData[index];
                            const g = imgData[index + 1];
                            const b = imgData[index + 2];
                            const a = imgData[index + 3];

                            if (a === 0) continue;

                            const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                            const alpha = (a / 255).toFixed(2);

                            svg += `  <rect x="${x}" y="${y}" width="1" height="1" fill="${hex}"${a < 255 ? ` fill-opacity="${alpha}"` : ''} />\n`;
                        }
                    }

                    svg += '</svg>';
                    output.value = svg;
                    drop.innerText = 'Success! Code Generated Below.';
                } catch (err) {
                    output.value = 'Error reading pixels: ' + err.message;
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            };

            img.onerror = function() {
                output.value = 'Unable to load the selected image file.';
                URL.revokeObjectURL(objectUrl);
            };

            img.src = objectUrl;
        }
    </script>

</body>
</html>
