<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to JavaScript Pixel Array</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        textarea { width: 100%; height: 450px; background: #1e1e1e; color: #4af626; padding: 15px; box-sizing: border-box; font-family: monospace; font-size: 11px; border-radius: 4px; border: 1px solid #000; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Image to Pure JavaScript Array Generator</h2>
    <div class="drop-box" id="drop">Click or Drop Image Here to Output Pure JavaScript</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <textarea id="output" readonly placeholder="The generated JavaScript variable scripts will print directly here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        
        drop.ondrop = (e) => { e.preventDefault(); if(e.dataTransfer.files.length) process(e.dataTransfer.files[0]); };
        file.onchange = (e) => { if(e.target.files.length) process(e.target.files[0]); };

        function process(targetFile) {
            if (!targetFile) return;
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                try {
                    const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                    
                    // Initialize raw JavaScript script definitions layout matrix
                    let jsCode = `// Generated Pixel Array Script Map\n`;
                    jsCode += `const imageWidth = ${img.width};\n`;
                    jsCode += `const imageHeight = ${img.height};\n\n`;
                    jsCode += `const pixelMatrix = [\n`;

                    for (let y = 0; y < img.height; y++) {
                        let rowText = `  [`;
                        for (let x = 0; x < img.width; x++) {
                            const idx = (y * img.width + x) * 4;
                            const r = imgData[idx];
                            const g = imgData[idx + 1];
                            const b = imgData[idx + 2];
                            const a = imgData[idx + 3];

                            if (a === 0) {
                                rowText += `null`;
                            } else {
                                const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                                if (a < 255) {
                                    rowText += `"${hex}${a.toString(16).padStart(2, '0').toUpperCase()}"`;
                                } else {
                                    rowText += `"${hex}"`;
                                }
                            }
                            if (x < img.width - 1) rowText += `, `;
                        }
                        jsCode += rowText + `]${y < img.height - 1 ? ',' : ''}\n`;
                    }

                    jsCode += `];\n`;

                    output.value = jsCode;
                    drop.innerText = `Successfully Generated JavaScript Script (${img.width}x${img.height}px)`;
                } catch (err) {
                    output.value = "// Error parsing pixel arrays: " + err.message;
                }
            };

            img.src = URL.createObjectURL(targetFile);
        }
    </script>

</body>
</html>
