<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel-Perfect Canvas & Text Display</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        
        .flex-container { display: flex; gap: 20px; margin-top: 20px; align-items: flex-start; }
        .panel { flex: 1; min-width: 0; }
        
        /* Forces crisp hardware visual scaling */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #ccc;
            background: #1a1a1a;
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
        }

        /* Dedicated display box for the raw pixel array text representation */
        .text-box {
            width: 100%;
            height: 400px;
            background: #222;
            color: #0f0;
            padding: 10px;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
            font-size: 11px;
            border: 1px solid #000;
        }
        h3 { margin-top: 0; }
    </style>
</head>
<body>

    <div class="drop-box" id="drop">Click or Drop Image Here</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <div class="flex-container">
        <!-- Left Panel: The Rendered Pixel Canvas Element -->
        <div class="panel">
            <h3>Visual Canvas Render</h3>
            <canvas id="pixelCanvas"></canvas>
        </div>
        
        <!-- Right Panel: The Extracted Text Display Box -->
        <div class="panel">
            <h3>Extracted Pixel Text Array</h3>
            <div id="pixelTextBox" class="text-box">Pixel text matrix will generate here...</div>
        </div>
    </div>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const pixelTextBox = document.getElementById('pixelTextBox');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        drop.ondrop = (e) => { e.preventDefault(); process(e.dataTransfer.files); };
        file.onchange = (e) => process(e.target.files);

        function process(selectedFile) {
            if (!selectedFile) return;
            
            const img = new Image();
            img.onload = function() {
                // Initialize canvas sizes precisely match source asset dimensions
                canvas.width = img.width;
                canvas.height = img.height;

                // Lock anti-aliasing interpolation filters out of pipeline
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                
                // Read the image hardware byte sequence matrix array back out
                const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                let textRepresentation = `Image Matrix: ${img.width} x ${img.height}\n\n`;

                for (let y = 0; y < img.height; y++) {
                    let rowText = `Row ${String(y).padStart(3, '0')}: `;
                    for (let x = 0; x < img.width; x++) {
                        const index = (y * img.width + x) * 4;
                        const r = imgData[index];
                        const g = imgData[index + 1];
                        const b = imgData[index + 2];
                        const a = imgData[index + 3];

                        // Skip text dump tracking overhead if completely empty layout space
                        if (a === 0) {
                            rowText += "[TRANSPARENT] ";
                        } else {
                            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                            rowText += `[${hex}, A:${(a/255).toFixed(1)}] `;
                        }
                    }
                    textRepresentation += rowText + "\n";
                }

                // Render compiled string directly inside screen container element interface layout
                pixelTextBox.textContent = textRepresentation;
                drop.innerText = `Rendered successfully! Layout size: (${img.width}x${img.height}px)`;
            };

            img.src = URL.createObjectURL(selectedFile);
        }
    </script>

</body>
</html>
