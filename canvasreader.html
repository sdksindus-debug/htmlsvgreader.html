<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to Canvas Text Array Converter</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        pre { width: 100%; height: 450px; background: #1e1e1e; color: #4af626; padding: 15px; box-sizing: border-box; overflow: auto; font-size: 11px; border-radius: 4px; border: 1px solid #000; }
    </style>
</head>
<body>

    <h2>Image to Text Matrix Array</h2>
    <div class="drop-box" id="drop">Click or Drop Image Here to Extract Coordinates</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    
    <h3>Extracted Array Data</h3>
    <pre id="output">Uploaded image pixel records will output here...</pre>

    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');

        drop.onclick = () => file.click();
        drop.ondragover = (e) => e.preventDefault();
        
        // Fixed: Extract the single [0] file node from the Transfer payload block
        drop.ondrop = (e) => { e.preventDefault(); if(e.dataTransfer.files.length) process(e.dataTransfer.files[0]); };
        file.onchange = (e) => { if(e.target.files.length) process(e.target.files[0]); };

        function process(targetFile) {
            if (!targetFile) return;
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                try {
                    const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                    let text = `Dimensions: ${img.width} x ${img.height}\n\n`;

                    for (let y = 0; y < img.height; y++) {
                        let row = `Y-${String(y).padStart(3, '0')}: `;
                        for (let x = 0; x < img.width; x++) {
                            const idx = (y * img.width + x) * 4;
                            const a = imgData[idx + 3];

                            if (a === 0) {
                                row += ". "; 
                            } else {
                                const hex = "#" + ((1 << 24) + (imgData[idx] << 16) + (imgData[idx+1] << 8) + imgData[idx+2]).toString(16).slice(1).toUpperCase();
                                row += `${hex} `;
                            }
                        }
                        text += row + "\n";
                    }

                    output.textContent = text;
                    drop.innerText = `Extracted (${img.width}x${img.height}px) Layout Matrix Successfully.`;
                    
                    // Revoke data pipeline pointer to clean memory
                    URL.revokeObjectURL(img.src);
                } catch (err) {
                    output.textContent = "Processing Error: " + err.message;
                }
            };

            // Safely reference the standalone unpacked file object binary address 
            img.src = URL.createObjectURL(targetFile);
        }
    </script>

</body>
</html>
