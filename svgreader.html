<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Reader to SVG Glitch Lab</title>
    <style>
        body { font-family: monospace; max-width: 1000px; margin: 20px auto; padding: 20px; color: #222; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        .drop-box.dragging { background: #e8f2ff; border-color: #1769aa; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 16px 0; }
        .controls label { display: flex; align-items: center; gap: 8px; }
        #status { min-height: 1.4em; }
        #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 20px; }
        .result-card { min-width: 0; border: 1px solid #ccc; padding: 14px; }
        .result-card h2 { font-size: 1.05rem; margin: 0 0 8px; }
        .result-card p { min-height: 2.8em; font-size: .9rem; }
        .preview { display: block; box-sizing: border-box; max-width: 100%; height: auto; margin: 8px 0; border: 1px solid #ccc; image-rendering: pixelated; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        button, select, input { padding: 8px 11px; }
        button { cursor: pointer; }
        textarea { box-sizing: border-box; width: 100%; height: 190px; margin-top: 10px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="drop-box" id="drop">Click or drop an image here to extract and glitch SVG paths</div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="controls" aria-label="Glitch settings">
        <label for="glitch-count">Glitch variations
            <select id="glitch-count">
                <option value="2">2</option><option value="3" selected>3</option>
                <option value="4">4</option><option value="6">6</option>
            </select>
        </label>
        <label for="glitch-intensity">Maximum horizontal shift
            <input id="glitch-intensity" type="range" min="4" max="80" value="24">
            <output id="intensity-value">24 px</output>
        </label>
    </div>
    <p id="status" role="status">Choose an image to create rectangle, path, glitch, and reread versions.</p>
    <section id="results" aria-label="Generated image versions" hidden></section>

    <script>
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('file');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const glitchCount = document.getElementById('glitch-count');
        const glitchIntensity = document.getElementById('glitch-intensity');
        const intensityValue = document.getElementById('intensity-value');
        let processId = 0;

        glitchIntensity.addEventListener('input', () => { intensityValue.value = `${glitchIntensity.value} px`; });
        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', (event) => { event.preventDefault(); drop.classList.add('dragging'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
        drop.addEventListener('drop', (event) => {
            event.preventDefault();
            drop.classList.remove('dragging');
            process(event.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (event) => process(event.target.files[0]));

        async function process(selectedFile) {
            if (!selectedFile) return;
            if (!selectedFile.type.startsWith('image/')) {
                status.textContent = 'Please choose a valid image file.';
                return;
            }

            const thisProcess = ++processId;
            results.replaceChildren();
            results.hidden = true;
            status.textContent = 'Reading image, converting rectangles to paths, and generating linear glitches…';
            const objectUrl = URL.createObjectURL(selectedFile);

            try {
                const image = await loadImage(objectUrl);
                const width = image.naturalWidth;
                const height = image.naturalHeight;
                const sourceCanvas = document.createElement('canvas');
                sourceCanvas.width = width;
                sourceCanvas.height = height;
                const sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
                sourceContext.drawImage(image, 0, 0);

                // Extract rectangle elements, parse them back, and convert each rectangle to SVG path data.
                const initial = pixelsToSvg(sourceContext.getImageData(0, 0, width, height).data, width, height);
                const shapes = readSvgRectangles(initial.svg);
                const pathSvg = rectanglesToPaths(shapes, width, height);
                const pathCanvas = await renderSvgToCanvas(pathSvg, width, height);
                const reread = pixelsToSvg(
                    pathCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height).data,
                    width, height
                );
                if (thisProcess !== processId) return;

                addResultCard('Rectangle SVG', `${initial.rectCount.toLocaleString()} extracted rectangles`, initial.svg, sourceCanvas, 'rectangles');
                addResultCard('Path SVG', `${shapes.length.toLocaleString()} rectangle elements converted to grouped path data`, pathSvg, pathCanvas, 'paths');
                addResultCard('Path reread SVG', `${reread.rectCount.toLocaleString()} rectangles rebuilt from the rendered paths`, reread.svg, pathCanvas, 'paths-reread');

                const count = Number(glitchCount.value);
                const intensity = Number(glitchIntensity.value);
                for (let variation = 1; variation <= count; variation++) {
                    if (thisProcess !== processId) return;
                    const glitchedSvg = glitchPathSvg(pathSvg, width, height, variation, intensity);
                    const glitchedCanvas = await renderSvgToCanvas(glitchedSvg, width, height);
                    const glitchedPixels = glitchedCanvas.getContext('2d', { willReadFrequently: true })
                        .getImageData(0, 0, width, height).data;
                    const glitchedReread = pixelsToSvg(glitchedPixels, width, height);
                    addResultCard(`Linear glitch ${variation}`, `Path-based horizontal band shifts; maximum shift ${intensity} px`, glitchedSvg, glitchedCanvas, `glitch-${variation}-paths`);
                    addResultCard(`Glitch ${variation} reread`, `${glitchedReread.rectCount.toLocaleString()} rectangles extracted from the glitched path preview`, glitchedReread.svg, glitchedCanvas, `glitch-${variation}-reread`);
                }

                results.hidden = false;
                status.textContent = `Generated rectangle, path, and reread SVGs plus ${count} linear glitch variations (${width} × ${height}). Download SVG text or PNG previews from each card.`;
                drop.textContent = 'Success! Drop another image or click to choose one.';
            } catch (error) {
                if (thisProcess === processId) status.textContent = 'Could not process image: ' + error.message;
            } finally {
                URL.revokeObjectURL(objectUrl);
            }
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error('The selected file could not be loaded as an image.'));
                image.src = url;
            });
        }

        function pixelsToSvg(data, width, height) {
            const lines = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" shape-rendering="crispEdges">\n`];
            let rectCount = 0;
            for (let y = 0; y < height; y++) {
                let runStart = -1;
                let runColor = '';
                let runAlpha = 0;
                for (let x = 0; x <= width; x++) {
                    const index = (y * width + x) * 4;
                    const alphaByte = x < width ? data[index + 3] : 0;
                    const color = alphaByte > 0
                        ? '#' + [data[index], data[index + 1], data[index + 2]].map(toHex).join('').toUpperCase()
                        : '';
                    const alpha = alphaByte / 255;
                    if (runStart !== -1 && (color !== runColor || alphaByte !== Math.round(runAlpha * 255))) {
                        lines.push(writeRect(runStart, y, x - runStart, runColor, runAlpha));
                        rectCount++;
                        runStart = -1;
                    }
                    if (runStart === -1 && alphaByte > 0) {
                        runStart = x;
                        runColor = color;
                        runAlpha = alpha;
                    }
                }
            }
            lines.push('</svg>');
            return { svg: lines.join(''), rectCount };
        }

        function toHex(value) { return value.toString(16).padStart(2, '0'); }

        function writeRect(x, y, width, color, alpha) {
            const opacity = alpha < 1 ? ` fill-opacity="${Number(alpha.toFixed(8))}"` : '';
            return `  <rect x="${x}" y="${y}" width="${width}" height="1" fill="${color}"${opacity} />\n`;
        }

        function readSvgRectangles(svgText) {
            const parsed = new DOMParser().parseFromString(svgText, 'image/svg+xml');
            if (parsed.querySelector('parsererror')) throw new Error('Generated SVG could not be parsed.');
            return Array.from(parsed.querySelectorAll('svg > rect')).map((element) => ({
                x: Number(element.getAttribute('x')),
                y: Number(element.getAttribute('y')),
                width: Number(element.getAttribute('width')),
                height: Number(element.getAttribute('height')),
                color: element.getAttribute('fill'),
                opacity: Number(element.getAttribute('fill-opacity') || 1)
            }));
        }

        function rectanglesToPaths(shapes, width, height) {
            const groups = new Map();
            for (const shape of shapes) {
                const opacity = Number(shape.opacity.toFixed(8));
                const key = `${shape.color}|${opacity}`;
                if (!groups.has(key)) groups.set(key, { color: shape.color, opacity, paths: [] });
                groups.get(key).paths.push(`M${shape.x} ${shape.y}h${shape.width}v${shape.height}h-${shape.width}z`);
            }
            const lines = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" shape-rendering="crispEdges">\n`];
            for (const group of groups.values()) {
                const opacity = group.opacity < 1 ? ` fill-opacity="${group.opacity}"` : '';
                lines.push(`  <path fill="${group.color}"${opacity} d="${group.paths.join('')}" />\n`);
            }
            lines.push('</svg>');
            return lines.join('');
        }

        function glitchPathSvg(pathSvg, width, height, variation, maxShift) {
            const artwork = pathSvg.slice(pathSvg.indexOf('>') + 1, pathSvg.lastIndexOf('</svg>'));
            const bandHeight = Math.max(2, Math.ceil(height / (10 + variation * 2)));
            const random = seededRandom(variation * 7919 + width * 17 + height);
            const clipDefinitions = [];
            const shiftedBands = [];
            let band = 0;

            for (let y = 0; y < height; y += bandHeight, band++) {
                const currentHeight = Math.min(bandHeight, height - y);
                const shift = Math.round((random() * 2 - 1) * maxShift);
                clipDefinitions.push(`<clipPath id="band-${variation}-${band}"><rect x="0" y="${y}" width="${width}" height="${currentHeight}" /></clipPath>`);
                shiftedBands.push(`<g clip-path="url(#band-${variation}-${band})"><g transform="translate(${shift} 0)">${artwork}</g></g>`);
            }

            // Keep clip paths in defs, but put the clipped artwork after defs so the bands render.
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" shape-rendering="crispEdges">\n<defs>${clipDefinitions.join('\n')}</defs>\n${shiftedBands.join('\n')}\n</svg>`;
        }

        function seededRandom(seed) {
            let state = seed >>> 0;
            return () => {
                state = (state * 1664525 + 1013904223) >>> 0;
                return state / 4294967296;
            };
        }

        function renderSvgToCanvas(svg, width, height) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
                const image = new Image();
                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d', { willReadFrequently: true }).drawImage(image, 0, 0, width, height);
                        resolve(canvas);
                    } catch (error) {
                        reject(error);
                    } finally {
                        URL.revokeObjectURL(url);
                    }
                };
                image.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('The generated path SVG could not be rendered.'));
                };
                image.src = url;
            });
        }

        function addResultCard(title, description, svgText, imageCanvas, filename) {
            const card = document.createElement('article');
            card.className = 'result-card';
            const heading = document.createElement('h2');
            heading.textContent = title;
            const details = document.createElement('p');
            details.textContent = description;
            const preview = document.createElement('canvas');
            preview.className = 'preview';
            preview.width = imageCanvas.width;
            preview.height = imageCanvas.height;
            preview.setAttribute('aria-label', `${title} image preview`);
            preview.getContext('2d').drawImage(imageCanvas, 0, 0);
            const actions = document.createElement('div');
            actions.className = 'actions';
            const textButton = document.createElement('button');
            textButton.type = 'button';
            textButton.textContent = 'Download SVG text';
            textButton.addEventListener('click', () => downloadBlob(
                new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }), `pixel-art-${filename}.svg`
            ));
            const imageButton = document.createElement('button');
            imageButton.type = 'button';
            imageButton.textContent = 'Download PNG preview';
            imageButton.addEventListener('click', () => preview.toBlob((blob) => {
                if (blob) downloadBlob(blob, `pixel-art-${filename}.png`);
                else status.textContent = `The ${title} PNG preview could not be created.`;
            }, 'image/png'));
            actions.append(textButton, imageButton);
            const textLabel = document.createElement('label');
            textLabel.textContent = 'SVG text';
            const textarea = document.createElement('textarea');
            textarea.readOnly = true;
            textarea.setAttribute('aria-label', `${title} SVG text`);
            textarea.value = svgText;
            card.append(heading, details, preview, actions, textLabel, textarea);
            results.append(card);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
