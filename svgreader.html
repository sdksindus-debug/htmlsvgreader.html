<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Variant Lab</title>
    <style>
        :root {
            --olive: #999918; --ochre: #BAAA44; --red: #952222; --green: #09AF0B;
            --paper: #fffdf2; --ink: #292714; --muted: #625e35;
            --line: rgba(41, 39, 20, .18); --shadow: rgba(65, 58, 18, .14);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px; color: var(--ink); font-family: "Segoe UI", Tahoma, sans-serif;
            background-color: #faf8ea;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { margin: 0 0 18px; }
        h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 36px); color: var(--olive); }
        .intro { margin: 0; color: var(--muted); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin: 20px 0; }
        .drop-box {
            flex: 1; min-width: 260px; padding: 22px; text-align: center; cursor: pointer;
            border: 2px dashed var(--olive); border-radius: 12px; background: var(--paper); color: var(--ink);
            box-shadow: 0 5px 16px var(--shadow); user-select: none;
        }
        .drop-box:hover, .drop-box:focus-visible { background: #fff8cc; outline: 2px solid var(--olive); outline-offset: 2px; }
        #file { display: none; }
        button {
            border: 1px solid var(--olive); border-radius: 9px; padding: 11px 15px; font-weight: 700;
            background: var(--olive); color: white; cursor: pointer;
        }
        button:hover { filter: brightness(.94); }
        button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        button.secondary { background: var(--red); border-color: var(--red); }
        button.green { background: var(--green); border-color: var(--green); color: #10220e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 18px; }
        .panel, .variant-card {
            padding: 12px; background: var(--paper); border: 1px solid var(--ochre); border-radius: 13px;
            box-shadow: 0 7px 20px var(--shadow);
        }
        .panel h2, .variants h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--olive); }
        .image-wrap, .thumb {
            min-height: 210px; display: grid; place-items: center; overflow: auto; border: 1px solid var(--line);
            border-radius: 9px; background-color: white;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0;
        }
        .image-wrap img { max-width: 100%; max-height: 320px; display: block; }
        textarea {
            width: 100%; min-height: 260px; resize: vertical; padding: 14px; border: 1px solid var(--olive); border-radius: 11px;
            color: #f7f4df; background: #292714; font: 12px/1.5 Consolas, monospace;
        }
        .variants { margin-top: 20px; }
        .variant-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        .variant-card { overflow: hidden; }
        .variant-card h3 { margin: 0; color: var(--ink); font-size: 15px; }
        .variant-card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
        .thumb { min-height: 160px; }
        .thumb img { max-width: 100%; max-height: 220px; display: block; }
        .variant-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .mini-btn { padding: 8px 11px; font-size: 12px; }
        #status { min-height: 1.4em; color: var(--muted); }
        @media (max-width: 560px) { body { padding: 14px; } .toolbar button { flex: 1; } }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>Image Variant Lab</h1>
            <p class="intro">Upload an image to preview, select, and download simple visual variations.</p>
        </header>

        <div class="toolbar">
            <div class="drop-box" id="drop" role="button" tabindex="0" aria-controls="file">Click or drop an image here to create variations</div>
            <input type="file" id="file" accept="image/*">
            <button id="variantButton" type="button">Regenerate Variants</button>
            <button id="downloadCurrentSvg" class="secondary" type="button">Download Current SVG</button>
            <button id="downloadCurrentPng" class="green" type="button">Download Current PNG</button>
        </div>
        <p id="status" role="status" aria-live="polite">Choose an image to get started.</p>

        <section class="grid" aria-label="Image previews">
            <article class="panel"><h2>Original Image</h2><div class="image-wrap"><img id="originalPreview" alt="Original image preview"></div></article>
            <article class="panel"><h2>Selected Variant</h2><div class="image-wrap"><img id="imagePreview" alt="Selected image variation preview"></div></article>
        </section>
        <textarea id="output" readonly aria-label="Selected variant SVG markup" placeholder="Selected variant SVG markup will appear here..."></textarea>
        <section class="variants"><h2>Image Variants</h2><div id="variantGrid" class="variant-grid"></div></section>
    </main>

    <script>
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('file');
        const output = document.getElementById('output');
        const originalPreview = document.getElementById('originalPreview');
        const imagePreview = document.getElementById('imagePreview');
        const variantGrid = document.getElementById('variantGrid');
        const status = document.getElementById('status');
        let sourceImage = null;
        let imageWidth = 0;
        let imageHeight = 0;
        let currentVariant = null;
        let variants = [];

        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fileInput.click();
            }
        });
        drop.addEventListener('dragover', (event) => event.preventDefault());
        drop.addEventListener('drop', (event) => {
            event.preventDefault();
            if (event.dataTransfer.files[0]) processImage(event.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (event) => {
            if (event.target.files[0]) processImage(event.target.files[0]);
            event.target.value = '';
        });
        document.getElementById('variantButton').addEventListener('click', generateVariants);
        document.getElementById('downloadCurrentSvg').addEventListener('click', () => {
            if (currentVariant) downloadBlob(currentVariant.svg, `${currentVariant.slug}.svg`, 'image/svg+xml');
        });
        document.getElementById('downloadCurrentPng').addEventListener('click', () => {
            if (currentVariant) downloadBlob(currentVariant.png, `${currentVariant.slug}.png`, 'image/png');
        });

        function processImage(selectedFile) {
            if (!selectedFile || !selectedFile.type.startsWith('image/')) {
                status.textContent = 'Please choose a valid image file.';
                return;
            }
            const url = URL.createObjectURL(selectedFile);
            const image = new Image();
            image.onload = () => {
                sourceImage = image;
                imageWidth = image.naturalWidth;
                imageHeight = image.naturalHeight;
                originalPreview.src = url;
                drop.textContent = `Loaded ${selectedFile.name} — ${imageWidth} × ${imageHeight}`;
                try {
                    generateVariants();
                    status.textContent = `Created image variations for ${selectedFile.name}.`;
                } catch (error) {
                    status.textContent = `Could not process image: ${error.message}`;
                } finally {
                    URL.revokeObjectURL(url);
                }
            };
            image.onerror = () => {
                URL.revokeObjectURL(url);
                status.textContent = 'Image could not be loaded. Please try another file.';
            };
            image.src = url;
        }

        function makeSvg(pngData, width, height) {
            return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">\n` +
                `  <image width="${width}" height="${height}" href="${pngData}" xlink:href="${pngData}" />\n</svg>`;
        }

        function renderVariant(definition) {
            const canvas = document.createElement('canvas');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            const context = canvas.getContext('2d');
            if (!context) throw new Error('Canvas is not available in this browser.');

            context.filter = definition.filter || 'none';
            if (definition.flipX || definition.flipY) {
                context.translate(definition.flipX ? imageWidth : 0, definition.flipY ? imageHeight : 0);
                context.scale(definition.flipX ? -1 : 1, definition.flipY ? -1 : 1);
            }
            context.drawImage(sourceImage, 0, 0, imageWidth, imageHeight);
            const png = canvas.toDataURL('image/png');
            return {
                ...definition,
                png,
                svg: makeSvg(png, imageWidth, imageHeight),
                preview: png,
                width: imageWidth,
                height: imageHeight
            };
        }

        function generateVariants() {
            if (!sourceImage) {
                status.textContent = 'Choose an image before generating variants.';
                return;
            }
            const definitions = [
                { name: 'Original', slug: 'original', filter: 'none' },
                { name: 'Grayscale', slug: 'grayscale', filter: 'grayscale(1)' },
                { name: 'Sepia', slug: 'sepia', filter: 'sepia(1)' },
                { name: 'Inverted', slug: 'inverted', filter: 'invert(1)' },
                { name: 'Horizontal mirror', slug: 'horizontal-mirror', flipX: true },
                { name: 'Vertical mirror', slug: 'vertical-mirror', flipY: true },
                { name: 'Mirrored both ways', slug: 'double-mirror', flipX: true, flipY: true }
            ];
            variants = definitions.map(renderVariant);
            renderVariants();
            selectVariant(variants[0]);
        }

        function renderVariants() {
            variantGrid.replaceChildren();
            variants.forEach((variant, index) => {
                const card = document.createElement('article');
                card.className = 'variant-card';
                const meta = document.createElement('div');
                meta.className = 'meta';
                const title = document.createElement('h3');
                title.textContent = variant.name;
                const number = document.createElement('span');
                number.textContent = `${index + 1}/${variants.length}`;
                meta.append(title, number);

                const thumb = document.createElement('div');
                thumb.className = 'thumb';
                const image = new Image();
                image.alt = `${variant.name} preview`;
                image.src = variant.preview;
                thumb.append(image);

                const actions = document.createElement('div');
                actions.className = 'variant-actions';
                const use = button('Use preview', 'mini-btn', () => selectVariant(variant));
                const svg = button('Download SVG', 'mini-btn secondary', () => downloadBlob(variant.svg, `${variant.slug}.svg`, 'image/svg+xml'));
                const png = button('Download PNG', 'mini-btn green', () => downloadBlob(variant.png, `${variant.slug}.png`, 'image/png'));
                actions.append(use, svg, png);
                card.append(meta, thumb, actions);
                variantGrid.append(card);
            });
        }

        function button(label, className, onClick) {
            const element = document.createElement('button');
            element.type = 'button';
            element.className = className;
            element.textContent = label;
            element.addEventListener('click', onClick);
            return element;
        }

        function selectVariant(variant) {
            currentVariant = variant;
            output.value = variant.svg;
            imagePreview.src = variant.preview;
            imagePreview.alt = `${variant.name} preview`;
            status.textContent = `Selected ${variant.name} variant (${variant.width} × ${variant.height}).`;
        }

        function downloadBlob(data, filename, type) {
            const blob = data instanceof Blob ? data : new Blob([data], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
