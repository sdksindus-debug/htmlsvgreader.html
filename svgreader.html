<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Reader &amp; SVG Glitch Lab</title>
    <style>
        :root {
            --olive: #999918;
            --ochre: #BAAA44;
            --gold: #9C6400;
            --sand: #E3D05C;
            --yellow: #FCE957;
            --red: #952222;
            --lime: #CECE06;
            --green: #09AF0B;
            --paper: #fffdf2;
            --ink: #292714;
            --muted: #625e35;
            --line: rgba(41, 39, 20, .18);
            --shadow: rgba(65, 58, 18, .14);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, sans-serif;
            background-color: #faf8ea;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { margin: 0 0 18px; }
        h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 36px); color: var(--olive); }
        .intro { margin: 0; color: var(--muted); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin: 20px 0; }
        .drop-box {
            flex: 1; min-width: 260px; padding: 22px; text-align: center; cursor: pointer;
            border: 2px dashed var(--olive); border-radius: 12px; background: var(--paper); color: var(--ink);
            box-shadow: 0 5px 16px var(--shadow); user-select: none;
        }
        .drop-box:hover { background: #fff8cc; }
        #file { display: none; }
        button {
            border: 1px solid var(--olive); border-radius: 9px; padding: 11px 15px; font-weight: 700;
            background: var(--olive); color: white; cursor: pointer;
        }
        button:hover { filter: brightness(.94); }
        button.secondary { background: var(--red); border-color: var(--red); }
        button.green { background: var(--green); border-color: var(--green); color: #10220e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 18px; }
        .panel, .variant-card {
            padding: 12px; background: var(--paper); border: 1px solid var(--ochre); border-radius: 13px;
            box-shadow: 0 7px 20px var(--shadow);
        }
        .panel h2, .variants h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--olive); }
        .image-wrap, .thumb {
            min-height: 210px; display: grid; place-items: center; overflow: auto; border: 1px solid var(--line);
            border-radius: 9px; background-color: white;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0;
        }
        .image-wrap img { max-width: 100%; max-height: 320px; display: block; }
        textarea {
            width: 100%; min-height: 300px; resize: vertical; padding: 14px; border: 1px solid var(--olive); border-radius: 11px;
            color: #f7f4df; background: #292714; font: 12px/1.5 Consolas, monospace;
        }
        .variants { margin-top: 20px; }
        .variant-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        .variant-card { overflow: hidden; }
        .variant-card h3 { margin: 0; color: var(--ink); font-size: 15px; }
        .variant-card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
        .thumb { min-height: 160px; }
        .thumb img { max-width: 100%; max-height: 220px; display: block; }
        .variant-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .mini-btn { padding: 8px 11px; font-size: 12px; }
        .palette { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
        .swatch { width: 27px; height: 18px; border: 1px solid rgba(0,0,0,.2); border-radius: 3px; }
        @media (max-width: 560px) { body { padding: 14px; } .toolbar button { flex: 1; } }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>Pixel Reader &amp; SVG Glitch Lab</h1>
            <p class="intro">Extract image pixels as SVG rectangles, create glitch variations, and download SVG or PNG previews.</p>
            <div class="palette" aria-label="Active color palette">
                <span class="swatch" title="#999918" style="background:#999918"></span>
                <span class="swatch" title="#BAAA44" style="background:#BAAA44"></span>
                <span class="swatch" title="#9C6400" style="background:#9C6400"></span>
                <span class="swatch" title="#E3D05C" style="background:#E3D05C"></span>
                <span class="swatch" title="#FCE957" style="background:#FCE957"></span>
                <span class="swatch" title="#952222" style="background:#952222"></span>
                <span class="swatch" title="#CECE06" style="background:#CECE06"></span>
                <span class="swatch" title="#09AF0B" style="background:#09AF0B"></span>
            </div>
        </header>

        <div class="toolbar">
            <div class="drop-box" id="drop">Click or drop an image here to extract pixels and generate glitch previews</div>
            <input type="file" id="file" accept="image/*">
            <button id="glitchButton" type="button">Regenerate Glitches</button>
            <button id="downloadCurrentSvg" class="secondary" type="button">Download Current SVG</button>
            <button id="downloadCurrentPng" class="green" type="button">Download Current PNG</button>
        </div>

        <section class="grid" aria-label="Image previews">
            <article class="panel"><h2>Original Image</h2><div class="image-wrap"><img id="originalPreview" alt="Original image preview"></div></article>
            <article class="panel"><h2>Selected SVG Preview</h2><div class="image-wrap"><img id="svgPreview" alt="Selected SVG preview"></div></article>
        </section>
        <textarea id="output" readonly placeholder="Extracted or selected SVG markup will appear here..."></textarea>
        <section class="variants"><h2>Glitched Rectangle Variants</h2><div id="variantGrid" class="variant-grid"></div></section>
    </main>

    <script>
        const PALETTE = ['#999918', '#BAAA44', '#9C6400', '#E3D05C', '#FCE957', '#952222', '#CECE06', '#09AF0B'];
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const output = document.getElementById('output');
        const originalPreview = document.getElementById('originalPreview');
        const svgPreview = document.getElementById('svgPreview');
        const variantGrid = document.getElementById('variantGrid');
        let currentSvg = '';
        let imageWidth = 0;
        let imageHeight = 0;
        let extractedRects = [];
        let variants = [];

        drop.addEventListener('click', () => file.click());
        drop.addEventListener('dragover', (event) => event.preventDefault());
        drop.addEventListener('drop', (event) => {
            event.preventDefault();
            if (event.dataTransfer.files[0]) processImage(event.dataTransfer.files[0]);
        });
        file.addEventListener('change', (event) => {
            if (event.target.files[0]) processImage(event.target.files[0]);
        });
        document.getElementById('glitchButton').addEventListener('click', generateVariants);
        document.getElementById('downloadCurrentSvg').addEventListener('click', () => {
            if (currentSvg) downloadBlob(currentSvg, 'glitched-image.svg', 'image/svg+xml');
        });
        document.getElementById('downloadCurrentPng').addEventListener('click', async () => {
            if (!currentSvg) return;
            try { downloadBlob(await svgToPng(currentSvg), 'glitched-image.png', 'image/png'); }
            catch (error) { alert('Could not export PNG: ' + error.message); }
        });

        function processImage(selectedFile) {
            if (!selectedFile || !selectedFile.type.startsWith('image/')) return;
            const url = URL.createObjectURL(selectedFile);
            const img = new Image();
            img.onload = () => {
                imageWidth = img.naturalWidth;
                imageHeight = img.naturalHeight;
                originalPreview.src = url;
                const canvas = document.createElement('canvas');
                canvas.width = imageWidth;
                canvas.height = imageHeight;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0);
                try {
                    extractedRects = extractRects(ctx.getImageData(0, 0, imageWidth, imageHeight).data, imageWidth, imageHeight);
                    generateVariants();
                    drop.textContent = `Loaded ${selectedFile.name} — ${imageWidth} × ${imageHeight}`;
                } catch (error) {
                    output.value = 'Error reading pixels: ' + error.message;
                    drop.textContent = 'Could not read pixels. Try another image.';
                } finally {
                    URL.revokeObjectURL(url);
                }
            };
            img.onerror = () => { URL.revokeObjectURL(url); drop.textContent = 'Image could not be loaded.'; };
            img.src = url;
        }

        function extractRects(data, width, height) {
            const rects = [];
            for (let y = 0; y < height; y++) {
                let start = -1;
                let color = '';
                let alpha = 1;
                for (let x = 0; x <= width; x++) {
                    const index = (y * width + x) * 4;
                    const a = x < width ? data[index + 3] : 0;
                    const hex = x < width ? rgbHex(data[index], data[index + 1], data[index + 2]) : '';
                    const nextAlpha = a / 255;
                    if (start >= 0 && (a === 0 || hex !== color || nextAlpha !== alpha)) {
                        rects.push({ x: start, y, width: x - start, height: 1, fill: color, alpha });
                        start = -1;
                    }
                    if (a > 0 && start < 0) { start = x; color = hex; alpha = nextAlpha; }
                }
            }
            return rects;
        }

        function makeSvg(rects, width, height, options = {}) {
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" shape-rendering="crispEdges">\n`;
            for (const rect of rects) {
                const x = Math.round(rect.x + (options.offsetX || 0));
                const y = Math.round(rect.y + (options.offsetY || 0));
                const w = Math.max(1, Math.round(rect.width + (options.widthShift || 0)));
                svg += `  <rect x="${x}" y="${y}" width="${w}" height="${rect.height}" fill="${rect.fill}" fill-opacity="${rect.alpha.toFixed(3)}" />\n`;
            }
            if (options.label) {
                const fontSize = Math.max(16, Math.min(width, height) * 0.19);
                svg += `  <text x="${Math.round(width * 0.07)}" y="${Math.round(height * 0.55)}" fill="${options.textColor}" fill-opacity="0.72" font-family="monospace" font-size="${fontSize}" font-weight="bold" letter-spacing="3" transform="skewX(-10)">${escapeXml(options.label)}</text>\n`;
            }
            return svg + '</svg>';
        }

        function generateVariants() {
            if (!extractedRects.length) return;
            const configs = [
                { name: 'Olive scanline', color: PALETTE[0], dx: 2, dy: 1, width: 2, label: 'SCAN' },
                { name: 'Ochre slice split', color: PALETTE[1], dx: -5, dy: 2, width: 5, label: 'GLITCH' },
                { name: 'Crimson chromatic', color: PALETTE[5], dx: 4, dy: -2, width: 3, label: 'SHIFT' },
                { name: 'Lime desync', color: PALETTE[6], dx: -2, dy: 3, width: 7, label: 'PIXEL' },
                { name: 'Green signal', color: PALETTE[7], dx: 7, dy: 0, width: -1, label: 'SIGNAL' },
                { name: 'Yellow overprint', color: PALETTE[4], dx: 0, dy: -3, width: 4, label: 'ERROR' }
            ];
            variants = configs.map((config, index) => {
                const rects = extractedRects.map((rect, i) => {
                    const isGlitched = i % (index + 2) === 0;
                    return {
                        ...rect,
                        x: Math.max(0, Math.min(imageWidth - 1, rect.x + (isGlitched ? config.dx : 0))),
                        y: Math.max(0, Math.min(imageHeight - 1, rect.y + (isGlitched ? config.dy : 0))),
                        width: Math.max(1, rect.width + (isGlitched ? config.width : 0)),
                        fill: isGlitched ? mixColor(rect.fill, config.color, 0.45) : rect.fill
                    };
                });
                const svg = makeSvg(rects, imageWidth, imageHeight, { label: config.label, textColor: config.color });
                return { ...config, svg, preview: svgPreviewUrl(svg) };
            });
            renderVariants();
            selectVariant(variants[0]);
        }

        function renderVariants() {
            variantGrid.replaceChildren();
            variants.forEach((variant, index) => {
                const card = document.createElement('article');
                card.className = 'variant-card';
                const meta = document.createElement('div');
                meta.className = 'meta';
                const title = document.createElement('h3');
                title.textContent = variant.name;
                const number = document.createElement('span');
                number.textContent = `${index + 1}/${variants.length}`;
                meta.append(title, number);
                const thumb = document.createElement('div');
                thumb.className = 'thumb';
                const image = new Image();
                image.alt = `${variant.name} preview`;
                image.src = variant.preview;
                thumb.append(image);
                const actions = document.createElement('div');
                actions.className = 'variant-actions';
                const use = button('Use preview', 'mini-btn', () => selectVariant(variant));
                const svg = button('Download SVG', 'mini-btn secondary', () => downloadBlob(variant.svg, `${slug(variant.name)}.svg`, 'image/svg+xml'));
                const png = button('Download PNG', 'mini-btn green', async () => {
                    try { downloadBlob(await svgToPng(variant.svg), `${slug(variant.name)}.png`, 'image/png'); }
                    catch (error) { alert('Could not export PNG: ' + error.message); }
                });
                actions.append(use, svg, png);
                card.append(meta, thumb, actions);
                variantGrid.append(card);
            });
        }

        function button(label, className, onClick) {
            const element = document.createElement('button');
            element.type = 'button';
            element.className = className;
            element.textContent = label;
            element.addEventListener('click', onClick);
            return element;
        }

        function selectVariant(variant) {
            currentSvg = variant.svg;
            output.value = currentSvg;
            svgPreview.src = variant.preview;
        }

        function svgPreviewUrl(svg) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
        function downloadBlob(data, filename, type) {
            const blob = data instanceof Blob ? data : new Blob([data], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function svgToPng(svg) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = imageWidth;
                    canvas.height = imageHeight;
                    canvas.getContext('2d').drawImage(image, 0, 0, imageWidth, imageHeight);
                    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('PNG conversion failed')), 'image/png');
                };
                image.onerror = () => reject(new Error('SVG preview could not be rendered'));
                image.src = svgPreviewUrl(svg);
            });
        }
        function rgbHex(r, g, b) { return '#' + [r, g, b].map((value) => value.toString(16).padStart(2, '0')).join('').toUpperCase(); }
        function mixColor(hex, tint, amount) {
            const a = hex.slice(1).match(/.{2}/g).map((value) => parseInt(value, 16));
            const b = tint.slice(1).match(/.{2}/g).map((value) => parseInt(value, 16));
            return rgbHex(...a.map((value, i) => Math.round(value + (b[i] - value) * amount)));
        }
        function escapeXml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }
        function slug(value) { return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'glitch'; }
    </script>
</body>
</html>
