<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Reader to SVG</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 20px; color: #222; }
        .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; }
        .drop-box.dragging { background: #e8f2ff; border-color: #1769aa; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; align-items: center; }
        button { padding: 9px 14px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        textarea { box-sizing: border-box; width: 100%; height: 300px; margin-top: 12px; font-family: monospace; background: #222; color: #0f0; padding: 10px; }
        #status { min-height: 1.4em; }
    </style>
</head>
<body>
    <div class="drop-box" id="drop">Click or drop an image here to create a crisp SVG</div>
    <input type="file" id="file" accept="image/*" hidden>
    <p id="status" role="status" aria-live="polite">Choose an image to begin.</p>

    <div class="controls">
        <button id="downloadText" type="button" disabled>Download SVG</button>
    </div>

    <label for="output"><strong>Generated SVG text</strong></label>
    <textarea id="output" readonly placeholder="Generated SVG will appear here..."></textarea>

    <script>
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('file');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const downloadText = document.getElementById('downloadText');
        const TILE_SIZE = 512;
        const MAX_INLINE_SVG_BYTES = 2 * 1024 * 1024;
        // Above this limit, embed the source image to avoid generating billions of SVG nodes.
        const MAX_VECTOR_PIXELS = 25_000_000;
        let currentSvgBlob = null;
        let runId = 0;

        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', (event) => {
            event.preventDefault();
            drop.classList.add('dragging');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
        drop.addEventListener('drop', (event) => {
            event.preventDefault();
            drop.classList.remove('dragging');
            process(event.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (event) => {
            process(event.target.files[0]);
            fileInput.value = '';
        });
        downloadText.addEventListener('click', downloadSvg);

        function process(selectedFile) {
            if (!selectedFile) return;
            if (!selectedFile.type.startsWith('image/')) {
                status.textContent = 'Please choose a valid image file.';
                return;
            }

            const thisRun = ++runId;
            currentSvgBlob = null;
            output.value = '';
            downloadText.disabled = true;
            status.textContent = 'Loading image…';
            const objectUrl = URL.createObjectURL(selectedFile);
            const img = new Image();
            img.decoding = 'async';

            img.onload = async () => {
                try {
                    const width = img.naturalWidth;
                    const height = img.naturalHeight;
                    if (!width || !height || !Number.isSafeInteger(width * height)) {
                        throw new Error('The image dimensions are invalid or too large to process.');
                    }

                    const svgHeader = makeSvgHeader(width, height);
                    if (width * height > MAX_VECTOR_PIXELS) {
                        status.textContent = 'Large image detected; preserving the source image inside an SVG…';
                        const dataUrl = await readFileAsDataUrl(selectedFile);
                        if (thisRun !== runId) return;
                        currentSvgBlob = new Blob([
                            svgHeader,
                            `  <image x="0" y="0" width="${width}" height="${height}" href="${dataUrl}" preserveAspectRatio="none" image-rendering="pixelated" />\n`,
                            '</svg>'
                        ], { type: 'image/svg+xml;charset=utf-8' });
                        await showOutputOrDownloadHint(currentSvgBlob, thisRun);
                        if (thisRun === runId) {
                            downloadText.disabled = false;
                            drop.textContent = 'Success! Drop another image or click to choose one.';
                            status.textContent = `Large image preserved inside an SVG (${width.toLocaleString()} × ${height.toLocaleString()}; ${formatBytes(currentSvgBlob.size)}).`;
                        }
                        return;
                    }

                    const parts = [svgHeader];
                    const tileCanvas = document.createElement('canvas');
                    const tileContext = tileCanvas.getContext('2d', { willReadFrequently: true });
                    if (!tileContext) throw new Error('This browser could not create a canvas context.');
                    let rectCount = 0;
                    const totalTiles = Math.ceil(width / TILE_SIZE) * Math.ceil(height / TILE_SIZE);
                    let completedTiles = 0;

                    // Tile reads bound temporary pixel memory; coordinates remain in source pixels.
                    for (let tileY = 0; tileY < height; tileY += TILE_SIZE) {
                        for (let tileX = 0; tileX < width; tileX += TILE_SIZE) {
                            if (thisRun !== runId) return;
                            const tileWidth = Math.min(TILE_SIZE, width - tileX);
                            const tileHeight = Math.min(TILE_SIZE, height - tileY);
                            tileCanvas.width = tileWidth;
                            tileCanvas.height = tileHeight;
                            tileContext.drawImage(img, tileX, tileY, tileWidth, tileHeight, 0, 0, tileWidth, tileHeight);
                            const pixels = tileContext.getImageData(0, 0, tileWidth, tileHeight).data;
                            const result = pixelsToSvg(pixels, tileWidth, tileHeight, tileX, tileY);
                            parts.push(result.svg);
                            rectCount += result.rectCount;
                            completedTiles++;
                            status.textContent = `Converting image to crisp SVG… ${Math.floor(completedTiles / totalTiles * 100)}%`;
                        }
                        await new Promise((resolve) => setTimeout(resolve, 0));
                    }
                    if (thisRun !== runId) return;
                    parts.push('</svg>');
                    currentSvgBlob = new Blob(parts, { type: 'image/svg+xml;charset=utf-8' });
                    await showOutputOrDownloadHint(currentSvgBlob, thisRun);
                    if (thisRun === runId) {
                        downloadText.disabled = false;
                        drop.textContent = 'Success! Drop another image or click to choose one.';
                        status.textContent = `${rectCount.toLocaleString()} crisp SVG rectangles generated (${width.toLocaleString()} × ${height.toLocaleString()}); ${formatBytes(currentSvgBlob.size)}.`;
                    }
                } catch (error) {
                    if (thisRun === runId) {
                        currentSvgBlob = null;
                        output.value = '';
                        downloadText.disabled = true;
                        status.textContent = 'Could not process image: ' + error.message;
                    }
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            };
            img.onerror = () => {
                URL.revokeObjectURL(objectUrl);
                if (thisRun === runId) status.textContent = 'The selected file could not be loaded as an image.';
            };
            img.src = objectUrl;
        }

        function makeSvgHeader(width, height) {
            return `<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">\n`;
        }

        async function showOutputOrDownloadHint(blob, thisRun) {
            if (blob.size <= MAX_INLINE_SVG_BYTES) {
                output.value = await blob.text();
            } else {
                output.value = `SVG generated (${formatBytes(blob.size)}). It is too large to display safely in this text area; use “Download SVG” to save the complete file.`;
            }
            if (thisRun !== runId) return;
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('The original image could not be embedded in the SVG.'));
                reader.readAsDataURL(file);
            });
        }

        function pixelsToSvg(data, width, height, offsetX, offsetY) {
            const lines = [];
            let rectCount = 0;
            for (let y = 0; y < height; y++) {
                let runStart = -1;
                let runColor = '';
                let runAlphaByte = 0;
                for (let x = 0; x <= width; x++) {
                    const index = (y * width + x) * 4;
                    const alphaByte = x < width ? data[index + 3] : 0;
                    const color = alphaByte > 0
                        ? '#' + [data[index], data[index + 1], data[index + 2]].map(toHex).join('').toUpperCase()
                        : '';
                    if (runStart !== -1 && (color !== runColor || alphaByte !== runAlphaByte)) {
                        lines.push(writeRect(runStart + offsetX, y + offsetY, x - runStart, runColor, runAlphaByte));
                        rectCount++;
                        runStart = -1;
                    }
                    if (runStart === -1 && alphaByte > 0) {
                        runStart = x;
                        runColor = color;
                        runAlphaByte = alphaByte;
                    }
                }
            }
            return { svg: lines.join(''), rectCount };
        }

        function toHex(value) {
            return value.toString(16).padStart(2, '0');
        }

        function writeRect(x, y, width, color, alphaByte) {
            const opacity = alphaByte < 255 ? ` fill-opacity="${(alphaByte / 255).toString()}"` : '';
            return `  <rect x="${x}" y="${y}" width="${width}" height="1" fill="${color}"${opacity} shape-rendering="crispEdges" />\n`;
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        function downloadSvg() {
            if (currentSvgBlob) downloadBlob(currentSvgBlob, 'pixel-art.svg');
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
