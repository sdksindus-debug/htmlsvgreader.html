<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Image to JavaScript Canvas Vector Paths</title>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 0 20px; }
    .drop-box { border: 2px dashed #333; padding: 30px; text-align: center; cursor: pointer; background: #f9f9f9; user-select: none; }
    .drop-box.active { background: #eef; border-color: #66a; }
    .controls { margin: 12px 0; display:flex; gap:8px; align-items:center; }
    textarea { width: 100%; height: 420px; background: #1e1e1e; color: #4af626; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 12px; border-radius: 4px; border: 1px solid #333; }
    button { font-family: inherit; }
    canvas.preview { border:1px solid #ccc; display:block; margin-top: 8px; max-width:100%; }
    .meta { margin-top:8px; color:#444; font-size:13px; }
  </style>
</head>
<body>
  <h2>Image → JavaScript Canvas Line API Script</h2>
  <div id="drop" class="drop-box" tabindex="0">Click or Drop Image Here to Generate Vector Paths</div>
  <input id="file" type="file" accept="image/*" style="display:none" />
  <div class="controls">
    <button id="copyBtn">Copy Script</button>
    <button id="downloadBtn">Download Script</button>
    <label style="margin-left:auto">
      Alpha threshold:
      <input id="alphaThresh" type="number" min="0" max="255" value="1" style="width:64px" />
    </label>
  </div>

  <canvas id="preview" class="preview" width="0" height="0" style="display:none"></canvas>

  <textarea id="output" readonly placeholder="Generated JavaScript Canvas Line API script will appear here..."></textarea>
  <div class="meta" id="meta"></div>

<script>
(function () {
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const output = document.getElementById('output');
  const preview = document.getElementById('preview');
  const meta = document.getElementById('meta');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const alphaThreshInput = document.getElementById('alphaThresh');

  let currentObjectUrl = null;

  function setMeta(text) { meta.textContent = text || ''; }

  function toRgbaString(r,g,b,a) {
    return `rgba(${r}, ${g}, ${b}, ${ (a/255).toFixed(3) })`;
  }

  function clearPreview() {
    preview.style.display = 'none';
    preview.width = preview.height = 0;
  }

  function enableDropVisual(on) {
    drop.classList.toggle('active', on);
  }

  // Click → open file dialog
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

  ['dragenter','dragover'].forEach(ev => {
    drop.addEventListener(ev, (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; enableDropVisual(true); });
  });
  ['dragleave','dragend','mouseout'].forEach(ev => {
    drop.addEventListener(ev, (e) => { enableDropVisual(false); });
  });

  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    enableDropVisual(false);
    const f = e.dataTransfer?.files?.[0];
    if (f) processFile(f);
  });

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files?.[0];
    if (f) processFile(f);
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.value || '');
      setMeta('Script copied to clipboard.');
    } catch (err) {
      setMeta('Copy failed: ' + (err && err.message));
    }
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([output.value || ''], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'canvas-lines.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  function revokeCurrentUrl() {
    if (currentObjectUrl) {
      try { URL.revokeObjectURL(currentObjectUrl); } catch(_) {}
      currentObjectUrl = null;
    }
  }

  function processFile(file) {
    revokeCurrentUrl();
    clearPreview();
    output.value = '';
    setMeta('Loading image...');
    const objectUrl = URL.createObjectURL(file);
    currentObjectUrl = objectUrl;

    const img = new Image();
    img.onload = () => {
      try {
        const w = img.width, h = img.height;
        setMeta(`Image loaded: ${w}×${h}px — scanning...`);

        // preview
        preview.width = w; preview.height = h;
        preview.style.display = '';
        const pctx = preview.getContext('2d');
        pctx.clearRect(0,0,w,h);
        pctx.drawImage(img, 0,0);

        // working canvas (offscreen)
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, w, h).data;
        const threshold = Number(alphaThreshInput.value) || 1;

        const scriptLines = [
          '// Generated Canvas Line Script',
          '// Usage: const c = document.getElementById("myCanvas"); const ctx = c.getContext("2d");',
          'ctx.lineWidth = 1;'
        ];

        // scan rows and aggregate contiguous runs of same RGBA
        for (let y = 0; y < h; y++) {
          let runStart = -1;
          let runColor = null;

          for (let x = 0; x <= w; x++) {
            const inside = x < w;
            const idx = inside ? (y * w + x) * 4 : -1;
            const a = inside ? imageData[idx + 3] : 0;
            let color = null;

            if (inside && a >= threshold) {
              const r = imageData[idx];
              const g = imageData[idx + 1];
              const b = imageData[idx + 2];
              // Use rgba string so semi-transparent pixels are preserved.
              color = toRgbaString(r,g,b,a);
            }

            const filled = !!color;
            const same = runColor !== null && filled && color === runColor;

            if (runStart >= 0 && (!filled || !same)) {
              // close run at x-1
              const x0 = runStart + 0.5;
              const x1 = (x - 0.5);
              const yPos = (y + 0.5).toFixed(1);
              scriptLines.push(
                `ctx.strokeStyle = "${runColor}"; ctx.beginPath(); ctx.moveTo(${x0}, ${yPos}); ctx.lineTo(${x1}, ${yPos}); ctx.stroke();`
              );
              runStart = -1;
              runColor = null;
            }

            if (filled && runStart < 0) {
              runStart = x;
              runColor = color;
            }
          }
        }

        output.value = scriptLines.join('\n');
        setMeta(`Successfully generated script (${w}×${h}).`);
      } catch (err) {
        console.error(err);
        output.value = `// Error building Canvas Vector instructions: ${err && err.message}`;
        setMeta('Error: see console for details.');
      } finally {
        // release image object URL now that the data is copied
        revokeCurrentUrl();
      }
    };

    img.onerror = (ev) => {
      output.value = '// Error: could not load the selected image.';
      setMeta('Image load failed.');
      revokeCurrentUrl();
    };

    img.src = objectUrl;
  }

})();
</script>
</body>
</html>
